<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitPulse — Your Fitness Command Center</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #111111;
  --bg-tertiary: #1a1a1a;
  --bg-card: #151515;
  --bg-hover: #1f1f1f;
  --accent: #6C5CE7;
  --accent-light: #a29bfe;
  --accent-dark: #4834d4;
  --green: #00b894;
  --green-light: #55efc4;
  --orange: #fdcb6e;
  --red: #e17055;
  --pink: #fd79a8;
  --blue: #74b9ff;
  --text-primary: #ffffff;
  --text-secondary: #a0a0a0;
  --text-tertiary: #666666;
  --border: #222222;
  --border-light: #2a2a2a;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 48px rgba(0,0,0,0.5);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

html {
  scroll-behavior: smooth;
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

a {
  text-decoration: none;
  color: inherit;
}

button {
  border: none;
  background: none;
  cursor: pointer;
  font-family: var(--font);
  color: var(--text-primary);
}

img {
  max-width: 100%;
}

/* ====== NAVIGATION ====== */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: rgba(10, 10, 10, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid transparent;
  z-index: 1000;
  transition: var(--transition);
}

.nav.scrolled {
  border-bottom-color: var(--border);
}

.nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.nav-logo-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--pink));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
}

.nav-link {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: var(--transition);
  position: relative;
}

.nav-link:hover, .nav-link.active {
  color: var(--text-primary);
}

.nav-link.active::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--accent);
  border-radius: 1px;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  transition: var(--transition);
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover {
  background: var(--accent-dark);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(108, 92, 231, 0.4);
}

.btn-secondary {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-light);
  color: var(--text-primary);
}

.btn-secondary:hover {
  background: var(--bg-hover);
  border-color: var(--text-tertiary);
}

.btn-ghost {
  color: var(--text-secondary);
  padding: 10px 12px;
}

.btn-ghost:hover {
  color: var(--text-primary);
}

.btn-large {
  padding: 14px 28px;
  font-size: 16px;
  border-radius: var(--radius-lg);
}

.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  padding: 8px;
  cursor: pointer;
}

.hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--text-primary);
  border-radius: 2px;
  transition: var(--transition);
}

.mobile-menu {
  display: none;
  position: fixed;
  top: 64px;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--bg-primary);
  padding: 24px;
  z-index: 999;
  flex-direction: column;
  gap: 8px;
}

.mobile-menu.open {
  display: flex;
}

.mobile-menu a {
  display: block;
  padding: 16px;
  font-size: 18px;
  font-weight: 500;
  color: var(--text-secondary);
  border-radius: var(--radius-md);
  transition: var(--transition);
}

.mobile-menu a:hover, .mobile-menu a.active {
  color: var(--text-primary);
  background: var(--bg-tertiary);
}

/* ====== PAGE SECTIONS ====== */
.page {
  display: none;
  min-height: 100vh;
  padding-top: 64px;
}

.page.active {
  display: block;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ====== LANDING PAGE ====== */
.hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: 80px 24px 96px;
  display: grid;
  grid-template-columns: 55% 45%;
  gap: 48px;
  align-items: center;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(108, 92, 231, 0.15);
  border: 1px solid rgba(108, 92, 231, 0.2);
  border-radius: 100px;
  font-size: 13px;
  color: var(--accent-light);
  margin-bottom: 24px;
}

.hero h1 {
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -1.5px;
  margin-bottom: 20px;
  background: linear-gradient(135deg, #fff 0%, #ccc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  font-size: 18px;
  line-height: 1.6;
  color: var(--text-secondary);
  max-width: 520px;
  margin-bottom: 32px;
}

.hero-ctas {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.hero-trust {
  font-size: 13px;
  color: var(--text-tertiary);
}

.hero-visual {
  position: relative;
}

.hero-mockup {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  transform: perspective(1000px) rotateY(-3deg) rotateX(1deg);
  transition: var(--transition);
}

.hero-mockup:hover {
  transform: perspective(1000px) rotateY(0deg) rotateX(0deg);
}

.mockup-bar {
  height: 36px;
  background: var(--bg-tertiary);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 6px;
}

.mockup-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border-light);
}

.mockup-dot:nth-child(1) { background: var(--red); opacity: 0.7; }
.mockup-dot:nth-child(2) { background: var(--orange); opacity: 0.7; }
.mockup-dot:nth-child(3) { background: var(--green); opacity: 0.7; }

.mockup-content {
  padding: 20px;
  min-height: 280px;
}

.mockup-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  margin-bottom: 6px;
  border-radius: var(--radius-sm);
  background: var(--bg-tertiary);
}

.mockup-check {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 2px solid var(--border-light);
  flex-shrink: 0;
}

.mockup-check.done {
  background: var(--green);
  border-color: var(--green);
}

.mockup-text {
  font-size: 13px;
  color: var(--text-secondary);
}

.mockup-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 100px;
  font-weight: 600;
}

.badge-green { background: rgba(0,184,148,0.15); color: var(--green); }
.badge-orange { background: rgba(253,203,110,0.15); color: var(--orange); }
.badge-red { background: rgba(225,112,85,0.15); color: var(--red); }
.badge-blue { background: rgba(116,185,255,0.15); color: var(--blue); }

.hero-float {
  position: absolute;
  bottom: -20px;
  left: -30px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  box-shadow: var(--shadow);
  animation: floatCard 3s ease-in-out infinite;
}

@keyframes floatCard {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.hero-float-title {
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.hero-float-stat {
  font-size: 24px;
  font-weight: 700;
  color: var(--green);
}

.hero-float-sub {
  font-size: 12px;
  color: var(--text-secondary);
}

/* Social Proof */
.social-proof {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 40px 24px;
  text-align: center;
}

.social-proof-label {
  font-size: 13px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 24px;
}

.logo-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 48px;
  flex-wrap: wrap;
  opacity: 0.4;
}

.logo-placeholder {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-secondary);
}

/* Features */
.features {
  max-width: 1200px;
  margin: 0 auto;
  padding: 96px 24px;
}

.section-label {
  text-align: center;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 12px;
}

.section-title {
  text-align: center;
  font-size: clamp(28px, 4vw, 42px);
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 16px;
}

.section-sub {
  text-align: center;
  font-size: 17px;
  color: var(--text-secondary);
  max-width: 600px;
  margin: 0 auto 56px;
  line-height: 1.6;
}

.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.feature-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
